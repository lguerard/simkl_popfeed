[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simkl-popfeed"
version = "0.1.0"
description = "Sync a Simkl profile's watch history to Popfeed via AT Protocol"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.scripts]
simkl-popfeed = "simkl_popfeed.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simkl_popfeed*"]
